<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root {
  --bg: #07170f;
  --panel: #0e2a1e;
  --panel-2: #133a29;
  --line: #1f4d38;
  --text: #eef5ef;
  --muted: #9db8a7;
  --green: #00653a;
  --gold: #ffc72c;
  --win: #4ade80;
  --loss: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
  min-height: 100vh; overflow-x: hidden;
}
header {
  background: linear-gradient(135deg, var(--green), #0b2a20 70%);
  border-bottom: 3px solid var(--gold);
  padding: 14px 16px 12px;
}
header .team { font-weight: 800; letter-spacing: .06em; font-size: 13px; color: var(--gold); }
header .rec { font-size: 26px; font-weight: 800; }
header .sub { font-size: 13px; color: var(--muted); }
main { padding: 16px; max-width: 560px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.stats b { display: block; font-size: 28px; line-height: 1.1; }
.stats span { font-size: 12px; color: var(--muted); }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 0; }
.big {
  width: 100%; padding: 18px 12px; font-size: 18px; font-weight: 800;
  background: var(--gold); color: #1b1300; box-shadow: 0 4px 0 #b88a00;
}
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88a00; }
.slip { width: 100%; margin-top: 12px; padding: 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
.ghost { padding: 10px 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.final { text-align: center; }
.final .score { font-size: 34px; font-weight: 800; margin: 6px 0; }
.final .wl { font-weight: 800; letter-spacing: .1em; }
.W { color: var(--win); } .L { color: var(--loss); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: var(--panel-2); color: var(--gold); white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.n, th.n { text-align: right; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: #0b2a20; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button { flex: 1; background: none; color: var(--muted); padding: 10px 0 12px; font-size: 12px; border-radius: 0; }
nav button.on { color: var(--gold); }
nav button .i { display: block; font-size: 20px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--loss); color: #fff; font-size: 11px; margin-left: 2px; }
.reveal { animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.suspense { text-align: center; padding: 30px 0; font-weight: 700; color: var(--gold); }
textarea { width: 100%; min-height: 90px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: 12px monospace; }
.hidden { display: none; }
.econ-line { display: flex; justify-content: space-between; gap: 8px; margin: -4px 2px 14px; font-size: 13px; color: var(--muted); }
.econ-line b { color: var(--gold); }
.payout { background: var(--panel-2); border-radius: 10px; padding: 10px; margin: 8px 0; font-weight: 700; color: var(--win); }
.meter-label { display: flex; justify-content: space-between; font-size: 14px; }
.meter { height: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
.meter div { height: 100%; background: linear-gradient(90deg, var(--loss), var(--gold), var(--win)); }
button:disabled { opacity: .5; }
#toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -80px); background: var(--gold); color: #1b1300;
  font-weight: 800; padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); text-align: center; transition: transform .3s; z-index: 10; font-size: 14px; }
#toast.show { transform: translate(-50%, 0); }
.quote { font-style: italic; margin: 0 0 10px; }
textarea.answer { min-height: 110px; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.entry { padding: 12px 0; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry .ans { margin: 0 0 6px; white-space: pre-wrap; }
.linkbtn { background: none; color: var(--muted); padding: 0; font-size: 13px; text-decoration: underline; }
nav button { min-width: 0; }
.lock { text-align: center; }
.lock .err { color: var(--loss); }
.dots { display: flex; justify-content: center; gap: 14px; margin: 14px 0 18px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); }
.dots span.on { background: var(--gold); }
.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; margin-bottom: 12px; }
.key { height: 72px; border-radius: 50%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-size: 26px; font-weight: 600; }
.key:active { background: var(--gold); color: #1b1300; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { padding: 10px 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
.pick.on { background: var(--gold); color: #1b1300; border-color: var(--gold); font-weight: 700; }
.pick:disabled { opacity: .4; }
.goalbox { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.story p { margin: 0 0 10px; }
.task { border-color: var(--gold); }
.task .yes { background: var(--gold); color: #1b1300; border-color: var(--gold); font-weight: 700; }
.task-row { padding: 12px 14px; margin-bottom: 10px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); font-size: 15px; }
.task-row.locked { color: var(--muted); border-style: dashed; }
.tasks-head { margin: 4px 2px 8px; }
.money { font-size: 40px; font-weight: 800; text-align: center; color: var(--win); margin: 2px 0 12px; font-variant-numeric: tabular-nums; }
.crave { width: 100%; padding: 14px; margin-bottom: 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--gold); font-weight: 700; }
.form label { display: block; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.form input, .form select { display: block; width: 100%; margin-top: 4px; padding: 10px; font-size: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
a { color: var(--gold); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <div class="team">SEATTLE SUPERSONICS</div>
  <div class="rec" id="hdrRec">0–0</div>
  <div class="sub" id="hdrSub"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="today"><span class="i">🏀</span>Today<span id="todayBadge"></span></button>
  <button data-tab="games"><span class="i">📅</span>Games</button>
  <button data-tab="journal"><span class="i">🎤</span>Journal</button>
  <button data-tab="roster"><span class="i">👥</span>Team</button>
  <button data-tab="news"><span class="i">📰</span>News<span id="newsBadge"></span></button>
  <button data-tab="more"><span class="i">⚙️</span>More</button>
</nav>
<script src="data.js"></script>
<script>
"use strict";
const DATA = window.SONICS_DATA;
const KEY = "sonics.v1";
const SEASON_GAMES = 82;
const HOME_ARENA = "Climate Pledge Arena";
const ROTATION_MINUTES = [34, 32, 30, 30, 28, 24, 22, 20, 20];
// What a person can focus on. "quit" = something to stop, "build" = something to do more of.
// goalOnly items can be extra goals but not someone's main battle. money = has a savings counter.
const FOCUS = {
  nicotine: { label: "Nicotine", type: "quit", money: true, free: "Nicotine-free", q: "Did you stay nicotine-free today?" },
  weed: { label: "Weed", type: "quit", money: true, free: "Weed-free", q: "Did you stay weed-free today?" },
  drinking: { label: "Drinking", type: "quit", money: true, free: "Alcohol-free", q: "Did you stay alcohol-free today?" },
  porn: { label: "Porn", type: "quit", free: "Porn-free", q: "Did you stay porn-free today?" },
  masturbation: { label: "Masturbation", type: "quit", free: "Clean", q: "Did you avoid masturbating today?" },
  gaming: { label: "Video games", type: "quit", free: "Game-free", q: "Did you stay off video games today?" },
  procrastination: { label: "Laziness / procrastination", type: "quit", free: "On task", q: "Did you get done what you'd been putting off today?" },
  workout: { label: "Working out", type: "build", q: "Did you work out today?" },
  relationships: { label: "Relationships", type: "build", goalOnly: true, q: "Did you put time into a relationship today (a call, a plan, quality time)?" },
  skill: { label: "New skill", type: "build", goalOnly: true, q: "Did you work on your new skill today?" },
  reading: { label: "Reading", type: "build", goalOnly: true, q: "Did you read today?" },
  meditating: { label: "Meditating", type: "build", goalOnly: true, q: "Did you meditate today?" },
  screenfree: { label: "Screen-free time", type: "build", goalOnly: true, q: "Did you take some screen-free time today?" },
};
const MAX_GOALS = 2;
// Ways to use something that costs money. Nicotine has several; weed and drinking have one each.
const HABITS = {
  pouches: { focus: "nicotine", label: "Nicotine pouches", unit: "pouch", units: "pouches", pack: "tin" },
  vape: { focus: "nicotine", label: "Vape", unit: "pod", units: "pods", pack: "pack" },
  cigarettes: { focus: "nicotine", label: "Cigarettes", unit: "cigarette", units: "cigarettes", pack: "pack" },
  dip: { focus: "nicotine", label: "Dip / chew", unit: "can", units: "cans", pack: "can" },
  weed: { focus: "weed", label: "Weed", unit: "bowl", units: "bowls", single: true },
  drinks: { focus: "drinking", label: "Drinks", unit: "drink", units: "drinks", single: true },
};
const DEFAULT_HABIT = { kind: "pouches", perDay: 12, perPack: 15, packPrice: 5.33 };
const DEFAULT_HABITS = {
  nicotine: DEFAULT_HABIT,
  weed: { kind: "weed", perDay: 2, perPack: 1, packPrice: 5 },
  drinking: { kind: "drinks", perDay: 3, perPack: 1, packPrice: 6 },
};
const DEFAULT_TIMES = { morning: "07:00", interview: "12:00", main: "20:00" };
const GOAL_TIMES = ["10:00", "16:00"];
const CRAVING_SECONDS = 5 * 60;

// ---------- helpers ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rand) {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function today() { return ymd(window.__fakeNow ? window.__fakeNow() : new Date()); }
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return ymd(new Date(y, m - 1, d + n));
}
function prettyDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// ---------- player and team strength ----------
// A player's rating is last season's Box Plus/Minus, pulled toward replacement level (-2)
// when he played few minutes, so a 5-game fluke doesn't count as much as a full season.
function playerRating(p) {
  const minutes = p.g * p.mp;
  return (p.bpm * minutes - 2 * 400) / (minutes + 400);
}
function rotation(roster) {
  return roster.slice().sort((a, b) => playerRating(b) - playerRating(a)).slice(0, ROTATION_MINUTES.length);
}
// Tuned (the 0.75) so a lineup of the worst free agents wins about 15 games a season on average,
// in line with the worst real NBA teams.
function teamRating(roster) {
  return 0.75 * rotation(roster).reduce((sum, p, i) => sum + playerRating(p) * ROTATION_MINUTES[i], 0) / 48;
}


// ---------- state ----------
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.version === 1) return migrate(s); } catch (e) {}
  return null;
}
// Fill in anything added after a person's save was first created, so updates never lose progress.
function migrate(s) {
  if (!s.habit) s.habit = { ...DEFAULT_HABIT, quitDate: s.startDate };
  if (!s.cravings) s.cravings = [];
  if (!s.profile) {
    // Saves from before goals existed were all nicotine. Ask them to pick goals.
    s.profile = { name: "", main: "nicotine", goals: [], times: { ...DEFAULT_TIMES }, needsGoals: true };
  }
  if (!s.goalLog) s.goalLog = {};
  if (!s.reportsRead) s.reportsRead = {};
  if (!s.profile.times.interview) s.profile.times.interview = DEFAULT_TIMES.interview;
  if (!s.journal) s.journal = [];
  if (!s.interviews) s.interviews = {};
  if (!s.econ) s.econ = newEcon();
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function newState(profile, habit) {
  const start = today();
  const seed = Math.floor(Math.random() * 2 ** 31);
  const s = {
    version: 1, seed, startDate: start, season: 1,
    roster: DATA.day1.roster.map(p => ({ ...p })),
    coach: { ...DATA.day1.coach }, gm: { ...DATA.day1.gm },
    log: [],        // one entry per day you checked in: {date, clean, game}
    seasons: [],    // finished seasons: {season, w, l}
    news: [],
    newsSeen: 0,
    profile: profile || { name: "", main: "nicotine", goals: [], times: { ...DEFAULT_TIMES } },
    habit: habit || { ...DEFAULT_HABIT, quitDate: start },
    cravings: [],   // {at, beaten}
    goalLog: {},    // {date: {goalId: true/false}}
    reportsRead: {},// {date: true}
    journal: [],    // {date, day, q, a, outlet, kind: "interview" | "note"}
    interviews: {}, // {date: {q, outlet, status: "open" | "answered" | "skipped"}}
    econ: newEcon(),
  };
  s.schedule = makeSchedule(seed, 1);
  const n = (type, text) => s.news.push({ date: start, type, text });
  n("FRANCHISE", "The Seattle SuperSonics are back (in this what-if world). Expectations: very, very low.");
  n("HIRED", `Sonics name ${s.profile.name || "a mystery hire"} President of Basketball Operations. The new boss's first battle: ${FOCUS[s.profile.main].label.toLowerCase()}.`);
  n("HIRED", `Sonics name ${s.gm.name} general manager. ${s.gm.fact}`);
  n("HIRED", `Sonics name ${s.coach.name} head coach. Career record: ${s.coach.record}.`);
  n("SIGNED", `Sonics sign 18 free agents nobody else wanted, led by ${s.roster[0].name} (worst VORP among available players last season).`);
  return s;
}

function makeSchedule(seed, season) {
  const rand = mulberry32(seed + season * 7919);
  const teams = DATA.teams.map(t => t.abbr);
  const games = [];
  teams.forEach(t => { games.push({ opp: t, home: true }); games.push({ opp: t, home: false }); });
  while (games.length < SEASON_GAMES) {
    games.push({ opp: teams[Math.floor(rand() * teams.length)], home: games.length % 2 === 0 });
  }
  for (let i = games.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [games[i], games[j]] = [games[j], games[i]];
  }
  return games;
}

let state = load() || null;
let locked = !!(state && state.lock);   // a passcode is set: start locked

// ---------- derived numbers ----------
function seasonGames(s = state) { return s.log.filter(e => e.game && e.game.season === s.season).map(e => e.game); }
function record(games) {
  return { w: games.filter(g => g.result === "W").length, l: games.filter(g => g.result === "L").length };
}
function cleanDays() { return state.log.filter(e => e.clean).length; }
function streak() {
  let n = 0;
  let d = today();
  const byDate = Object.fromEntries(state.log.map(e => [e.date, e]));
  if (!byDate[d]) d = addDays(d, -1);   // today not logged yet: count up to yesterday
  while (byDate[d] && byDate[d].clean) { n++; d = addDays(d, -1); }
  return n;
}
// ---------- savings ----------
function mainFocus() { return FOCUS[state.profile.main]; }
function hasMoney() { return !!mainFocus().money && !!state.habit.kind; }
function costPerDay(h = state.habit) { return h.kind ? h.perDay / h.perPack * h.packPrice : 0; }
function quitStart() { const [y, m, d] = state.habit.quitDate.split("-").map(Number); return new Date(y, m - 1, d); }
function nowDate() { return window.__fakeNow ? window.__fakeNow() : new Date(); }
function hasStarted() { return today() >= state.habit.quitDate; }
// Days since the quit date (with fractions, so the money ticks up during the day), minus slip days.
function daysFree() {
  const days = (nowDate() - quitStart()) / 86400000;
  const slips = state.log.filter(e => !e.clean).length;
  return Math.max(0, days - slips);
}
function money(n) { return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function sinceLastUse() {
  const lastSlip = state.log.filter(e => !e.clean).map(e => e.date).sort().pop();
  let from = quitStart();
  if (lastSlip) { const [y, m, d] = lastSlip.split("-").map(Number); from = new Date(y, m - 1, d + 1); }  // the day after the slip
  const ms = Math.max(0, nowDate() - from);
  const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
  return `${d}d ${h}h ${m}m`;
}
function dayNumber(date = today()) {
  const [y, m, d] = date.split("-").map(Number);
  return Math.round((new Date(y, m - 1, d) - quitStart()) / 86400000) + 1;
}

function entryFor(date) { return state.log.find(e => e.date === date); }
function todaysEntry() { return entryFor(today()); }
function teamByAbbr(a) { return DATA.teams.find(t => t.abbr === a); }

// ---------- daily tasks ----------
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}
function minutesNow() { const d = nowDate(); return d.getHours() * 60 + d.getMinutes(); }
function minutesOf(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }

// Today's tasks in time order. Each: {id, kind, time, open (unlocked and not done), done, locked, ...}.
function tasksFor() {
  if (!hasStarted()) return [];
  const t = today(), y = addDays(t, -1), now = minutesNow(), p = state.profile;
  const tasks = [];
  const add = (task) => {
    task.locked = !task.done && task.time && now < minutesOf(task.time);
    task.open = !task.done && !task.locked;
    tasks.push(task);
  };
  // Forgot last night's check-in? It stays open until today's is done.
  if (y >= state.habit.quitDate && !entryFor(y) && !todaysEntry()) {
    add({ id: "catchup", kind: "main", date: y, time: null, done: false });
  }
  add({ id: "report", kind: "report", time: p.times.morning, done: !!state.reportsRead[t] });
  p.goals.forEach(g => {
    const ans = (state.goalLog[t] || {})[g.id];
    add({ id: "goal-" + g.id, kind: "goal", goal: g, time: g.time, done: ans !== undefined, answer: ans });
  });
  const iv = state.interviews[t];
  add({ id: "interview", kind: "interview", time: p.times.interview, done: !!iv && iv.status !== "open" });
  add({ id: "main", kind: "main", date: t, time: p.times.main, done: !!todaysEntry() });
  return tasks.sort((a, b) => (a.time === null ? -1 : b.time === null ? 1 : minutesOf(a.time) - minutesOf(b.time)));
}
function openTaskCount() { return tasksFor().filter(t => t.open).length; }

// ---------- playing a game ----------
function playGame(clean) {
  const gameNo = seasonGames().length;            // 0-based index in this season
  const sched = state.schedule[gameNo];
  const opp = teamByAbbr(sched.opp);
  const rand = mulberry32(state.seed + state.season * 100003 + gameNo * 31 + 1);
  const mine = teamRating(state.roster);
  const homeEdge = sched.home ? 2.5 + state.econ.stadium * STADIUM_HOME_EDGE : -2.5;
  const moraleEdge = (state.econ.morale - 50) / 10;   // +-5 points at the extremes
  let margin = Math.round(mine - opp.srs + homeEdge + moraleEdge + gauss(rand) * 12);
  if (margin === 0) margin = rand() < 0.5 ? 1 : -1;  // no ties in basketball
  if (!clean && margin > 0) margin = -(1 + Math.floor(rand() * 12));  // slip day: the Sonics lose
  const oppPts = Math.round(113 + gauss(rand) * 8 - margin / 2);
  const myPts = oppPts + margin;

  // Split the Sonics' points among the rotation, weighted by how much each player scored last season.
  const rot = rotation(state.roster);
  const weights = rot.map((p, i) => (p.pts + 1) * ROTATION_MINUTES[i] * (0.6 + rand() * 0.8));
  const total = weights.reduce((a, b) => a + b, 0);
  const box = rot.map((p, i) => ({ name: p.name, pts: Math.round(myPts * weights[i] / total) }))
    .sort((a, b) => b.pts - a.pts);

  return {
    season: state.season, no: gameNo + 1, opp: opp.abbr, oppName: opp.name, home: sched.home,
    my: myPts, them: oppPts, result: margin > 0 ? "W" : "L", top: box[0], slip: !clean,
  };
}

// Log a day (today, or yesterday if it was missed) and play that day's game.
function checkIn(clean, date = today()) {
  if (entryFor(date) || date < state.habit.quitDate || date > today()) return;
  const game = playGame(clean);
  state.log.push({ date, clean, game });
  state.log.sort((a, b) => a.date < b.date ? -1 : 1);
  if (clean) addPending({ cap: REWARD.cleanNightCap }, `Clean check-in (game ${game.no})`, date);
  else award({ morale: REWARD.slipMorale }, "Slip day", date);
  if (game.result === "W") award({ revenue: REWARD.winRevenue }, `Ticket sales (win, game ${game.no})`, date);
  // Morale settles 30% back toward 50 every night, so it reflects how you've been showing up lately.
  const e = state.econ, drift = (50 - e.morale) * REWARD.moraleSettle;
  if (Math.abs(drift) >= 0.5) award({ morale: Math.round(drift) }, "Morale settles overnight", date);
  const where = game.home ? `at ${HOME_ARENA}` : `in ${game.oppName.split(" ").slice(0, -1).join(" ")}`;
  const verb = game.result === "W" ? "beat" : "fall to";
  state.news.push({
    date, type: game.result === "W" ? "WIN" : "LOSS",
    text: `Game ${game.no}: Sonics ${verb} the ${game.oppName} ${game.my}–${game.them} ${where}. ${game.top.name} led Seattle with ${game.top.pts}.`
      + (game.slip ? " (Slip day. Tomorrow is a new game.)" : ""),
  });
  if (seasonGames().length >= SEASON_GAMES) endSeason();
  save();
}

function endSeason() {
  const r = record(seasonGames());
  state.seasons.push({ season: state.season, w: r.w, l: r.l });
  state.news.push({ date: today(), type: "SEASON", text: `Season ${state.season} is over. Final record: ${r.w}–${r.l}. Season ${state.season + 1} tips off next time you check in.` });
  state.season += 1;
  state.schedule = makeSchedule(state.seed, state.season);
}

  } else {

  if (backBtn) backBtn.onclick = () => {

// ---------- media interviews (the journal) ----------
// Made-up outlets; the questions are prompts for you to reflect on your day.
const OUTLETS = ["Emerald City Hoops Report", "Puget Sound Sports Radio", "The Sonic Boom Podcast", "Rain City Courtside", "Space Needle Sports Desk"];
const STREAK_MILESTONES = [3, 7, 14, 21, 30, 45, 60, 90, 100, 120, 150, 180, 200, 250, 300, 365];
const MONEY_MILESTONES = [25, 50, 100, 250, 500, 750, 1000, 1500, 2000];

// The everyday questions. {x} is filled in below.
const GENERAL_QUESTIONS = [
  "The beginning of the season is tough. How do you keep motivated in the face of the battle ahead?",
  "What was the hardest moment today, and how did you handle it?",
  "Who's been in your corner lately?",
  "What's one thing that's better now than when you started?",
  "When a craving hits, what's the game plan?",
  "If you could talk to yourself on day one, what would you say?",
  "What are you most proud of this week?",
  "What triggers have you noticed lately, and how are you dealing with them?",
  "How are you sleeping and feeling physically these days?",
  "What's the long-term vision for this franchise, and for you?",
  "Give us one word for how today went, and explain it.",
  "What did you do today that future-you will thank you for?",
  "Your team is {record}. The fans are restless. What do you tell them?",
  "What's been the biggest surprise since you started?",
  "What's one thing you're looking forward to this week?",
  "What does a good day look like for you right now?",
  "Where do you feel the most pressure, and how do you handle it?",
  "What's a habit you've picked up that's helping?",
  "How do you reward yourself for a good day?",
  "What would you want your friends to know about how this is going?",
];

function hashStr(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

// Picks today's question from what's going on. The first match wins; otherwise a rotating everyday one.
function makeQuestion(date) {
  const name = state.profile.name;
  const f = mainFocus();
  const n = dayNumber(date);
  const y = addDays(date, -1);
  const ye = entryFor(y);
  const games = seasonGames();
  const r = record(games);
  const st = streak();
  const last = games[games.length - 1];
  const ask = (q) => q;
  if (n === 1) return ask(`Day one. The franchise is starting from scratch, and so are you. What made today the day?`);
  if (ye && !ye.clean) return ask(`Tough day yesterday. What happened, and what's the plan to bounce back?`);
  if (last && last.result === "W" && r.w === 1 && ye && ye.game === last)
    return ask(`${last.top.name} led the way to the franchise's first win last night, ${last.my}–${last.them}. How does it feel to finally get one?`);
  if (STREAK_MILESTONES.includes(st)) {
    const label = st === 7 ? "one full week" : st === 14 ? "two weeks" : st === 30 ? "a whole month" : st === 365 ? "an entire year" : `${st} days`;
    return ask(`That's ${label} ${f.type === "quit" ? f.free.toLowerCase() : "in a row"}. What's different about you now compared to day one?`);
  }
  if (hasMoney()) {
    const saved = daysFree() * costPerDay();
    const crossed = MONEY_MILESTONES.filter(m => saved >= m).pop();
    if (crossed && !state.journal.some(j => j.milestone === "money" + crossed))
      return { q: `You've saved more than $${crossed} by not buying ${HABITS[state.habit.kind].units}. What are you going to do with it?`, milestone: "money" + crossed };
  }
  let lossRun = 0; for (let i = games.length - 1; i >= 0 && games[i].result === "L"; i--) lossRun++;
  let winRun = 0; for (let i = games.length - 1; i >= 0 && games[i].result === "W"; i--) winRun++;
  if (lossRun >= 5 && lossRun % 5 === 0) return ask(`That's ${lossRun} straight losses. How do you keep the locker room, and yourself, believing?`);
  if (winRun >= 3) return ask(`${winRun} wins in a row! What's clicking right now?`);
  const goals = state.profile.goals;
  const pool = GENERAL_QUESTIONS.concat(goals.map(g => `How's the ${g.label.toLowerCase()} going? Be honest.`));
  const recent = state.journal.slice(-10).map(j => j.q);
  let i = hashStr(date + state.seed) % pool.length;
  for (let k = 0; k < pool.length && recent.includes(pool[i].replace("{record}", `${r.w}–${r.l}`)); k++) i = (i + 1) % pool.length;
  return ask(pool[i].replace("{record}", `${r.w}–${r.l}`));
}

// Today's interview, made once and then kept for the day.
function interviewFor(date) {
  if (!state.interviews[date]) {
    const made = makeQuestion(date);
    const q = typeof made === "string" ? { q: made } : made;
    state.interviews[date] = { ...q, outlet: OUTLETS[hashStr(date) % OUTLETS.length], status: "open" };
    save();
  }
  return state.interviews[date];
}

function answerInterview(date, text) {
  const iv = interviewFor(date);
  const a = text.trim();
  if (!a) return false;
  state.journal.push({ date, day: dayNumber(date), q: iv.q, a, outlet: iv.outlet, milestone: iv.milestone, kind: "interview" });
  iv.status = "answered";
  const who = state.profile.name ? `President ${state.profile.name}` : "The Sonics president";
  state.news.push({ date, type: "PRESSER", text: `${who} met with the ${iv.outlet}: "${a.length > 90 ? a.slice(0, 90) + "…" : a}"` });
  save();
  return true;
}

function interviewCard(task) {
  if (task.locked) return taskRow("🔒", `Media interview · ${fmtTime(task.time)}`, "locked");
  const iv = interviewFor(today());

function newEcon() { return { morale: 50, cap: 0, revenue: 0, stadium: 0, deals: [], pending: [], ledger: [] }; }
function fmtM(x) { return "$" + (Math.round(x * 100) / 100).toFixed(2).replace(/\.?0+$/, "") + "M"; }

// Apply a reward now. Returns a short text like "+3 morale" for a pop-up.
function award({ cap = 0, revenue = 0, morale = 0 }, note, date = today()) {
  const e = state.econ;
  e.cap += cap; e.revenue += revenue;
  e.morale = Math.max(0, Math.min(100, e.morale + morale));
  e.ledger.push({ date, note, cap, revenue, morale });
  if (e.ledger.length > 300) e.ledger.splice(0, e.ledger.length - 300);
  const parts = [];
  if (cap) parts.push(`${cap > 0 ? "+" : "−"}${fmtM(Math.abs(cap))} cap space`);
  if (revenue) parts.push(`+${fmtM(revenue)} revenue`);
  if (morale) parts.push(`${morale > 0 ? "+" : "−"}${Math.abs(morale)} morale`);
  return parts.join(", ");
}
// Rewards that wait for the next morning report.
function addPending(reward, note, date) { state.econ.pending.push({ ...reward, note, date }); }
function collectPending() {
  const lines = state.econ.pending.map(p => `${p.note}: ${award(p, p.note, p.date)}`);
  state.econ.pending = [];
  return lines;
}

function checkEndorsements(date) {
  const answered = state.journal.filter(j => j.kind === "interview").length;
  const got = [];
  ENDORSEMENTS.forEach(d => {
    if (answered >= d.after && !state.econ.deals.some(x => x.brand === d.brand)) {
      state.econ.deals.push({ brand: d.brand, amount: d.amount, date });
      award({ revenue: d.amount }, `Endorsement: ${d.brand}`, date);
      state.news.push({ date, type: "DEAL", text: `Sonics sign an endorsement deal with ${d.brand}: ${fmtM(d.amount)}. (Made-up brand; game money.)` });
      got.push(d);
    }
  });
  return got;
}

function upgradeStadium() {
  const e = state.econ, next = STADIUM[e.stadium + 1];
  if (!next || e.revenue < next.cost) return false;
  e.revenue -= next.cost;
  e.stadium += 1;
  award({ morale: STADIUM_MORALE }, `Stadium: ${next.name}`);
  e.ledger[e.ledger.length - 1].revenue = -next.cost;
  state.news.push({ date: today(), type: "STADIUM", text: `Sonics unveil their ${next.name.toLowerCase()} at ${HOME_ARENA}. The players love it.` });
  save();
  return true;
}

// ---------- passcode ----------
// A privacy screen: the 4-digit code is stored only as a scrambled (hashed) value on this device.
async function hashCode(code, salt) {
  const text = salt + ":" + code;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0;  // fallback for old browsers
  return "x" + h;
}

// Shows a keypad. onDone(code) gets the 4 digits; return a message to show (and clear), or nothing.
function keypad(title, sub, onDone, extra = "") {
  document.getElementById("nav").classList.add("hidden");
  let code = "";
  main.innerHTML = `<div class="card lock">
    <h2>${esc(title)}</h2>
    <p class="muted" id="padMsg">${esc(sub)}</p>
    <div class="dots" id="dots"></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k =>
      k === "" ? "<span></span>" : `<button class="key" data-key="${k}">${k}</button>`).join("")}</div>
    ${extra}
  </div>`;
  const dots = () => { document.getElementById("dots").innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < code.length ? "on" : ""}"></span>`).join(""); };
  dots();
  document.querySelectorAll("[data-key]").forEach(b => b.onclick = async () => {
    const k = b.dataset.key;
    if (k === "⌫") code = code.slice(0, -1);
    else if (code.length < 4) code += k;
    dots();
    if (code.length === 4) {
      const entered = code;
      const msg = await onDone(entered);
      if (msg) {
        code = ""; dots();
        const m = document.getElementById("padMsg");
        if (m) { m.textContent = msg; m.classList.add("err"); }
      }
    }
  });
}

function renderLock() {
  keypad("Sonics locked", "Enter your passcode", async code => {
    if (await hashCode(code, state.lock.salt) !== state.lock.hash) return "Wrong passcode. Try again.";
    locked = false; render();
  }, `<button class="slip" id="forgotBtn">Forgot passcode?</button>`);
  document.getElementById("forgotBtn").onclick = () => {
    if (!confirm("There's no way to recover a passcode: it's only stored on this phone.\n\nYou can erase this phone's Sonics progress and start over (then restore a backup file if you saved one). Erase everything?")) return;
    if (!confirm("Are you sure? This deletes your streak, games and answers on this phone.")) return;
    state = null; locked = false;
    try { localStorage.removeItem(KEY); } catch (e) {}
    render();
  };
}

function setPasscode() {
  keypad("Choose a passcode", "Pick 4 digits you'll remember", first => {
    keypad("Confirm passcode", "Enter the same 4 digits again", async second => {
      if (second !== first) return "Those didn't match. Enter the same 4 digits again.";
      const salt = Math.random().toString(36).slice(2);
      state.lock = { salt, hash: await hashCode(second, salt) };
      save(); alert("Passcode set. The app will ask for it each time you open it."); render();
    }, `<button class="slip" id="cancelPad">Cancel</button>`);
    document.getElementById("cancelPad").onclick = () => render();
  }, `<button class="slip" id="cancelPad">Cancel</button>`);
  document.getElementById("cancelPad").onclick = () => render();
}

function removePasscode() {
  keypad("Turn off passcode", "Enter your current passcode", async code => {
    if (await hashCode(code, state.lock.salt) !== state.lock.hash) return "Wrong passcode. Try again.";
    delete state.lock; save(); alert("Passcode turned off."); render();
  }, `<button class="slip" id="cancelPad">Cancel</button>`);
  document.getElementById("cancelPad").onclick = () => render();
}

        : `<p class="muted">No games yet. Check in on the Today tab.</p>`}
    </div>
    ${past ? `<div class="card"><h2>Past seasons</h2><ul class="list">${past}</ul></div>` : ""}`;
}

function renderRoster() {
  const rows = state.roster.slice().sort((a, b) => playerRating(b) - playerRating(a)).map(p => `<tr>
    <td>${esc(p.name)}</td><td>${p.pos}</td><td class="n">${p.pts.toFixed(1)}</td><td class="n">${p.vorp.toFixed(1)}</td></tr>`).join("");
  main.innerHTML = frontOfficeCard() + `
    <div class="card"><h2>Staff</h2>
      <p style="margin:0">Head coach: <b>${esc(state.coach.name)}</b> <span class="muted">(${esc(state.coach.record)})</span></p>
      <p style="margin:6px 0 0">General manager: <b>${esc(state.gm.name)}</b></p>
    </div>
    <div class="card"><h2>Roster (${state.roster.length})</h2>
      <table><thead><tr><th>Player</th><th>Pos</th><th class="n">PTS</th><th class="n">VORP</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="muted">PTS and VORP are real 2025-26 stats (Basketball-Reference). VORP below 0 means worse than a replacement-level player.</p>
    </div>`;
  const up = document.getElementById("upgradeBtn");
  if (up) up.onclick = () => {
    const next = STADIUM[state.econ.stadium + 1];
    if (!confirm(`Spend ${fmtM(next.cost)} of revenue on: ${next.name}?`)) return;
    if (upgradeStadium()) { render(); toast(`${next.name} built! +${STADIUM_MORALE} morale`); }
  };
}

function renderNews() {
  state.newsSeen = state.news.length; save();
  const items = state.news.slice().reverse().map(n => `<li>
    <span class="tag">${esc(n.type)}</span>
    <span class="grow">${esc(n.text)}<br><span class="muted">${prettyDate(n.date)}</span></span></li>`).join("");
  main.innerHTML = `<div class="card"><h2>Sonics news</h2><ul class="list">${items}</ul></div>`;
}

function renderMore() {
  const installed = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  main.innerHTML = `
    ${installed ? "" : `<div class="card"><h2>Put it on your iPhone</h2>
      <p style="margin:0">In Safari, tap the Share button (square with an arrow), then <b>Add to Home Screen</b>.</p></div>`}
    <div class="card"><h2>Passcode</h2>
      <p style="margin-top:0" class="muted">${state.lock
        ? "On. The app asks for your 4-digit code every time you open it."
        : "Lock the app with a 4-digit code so someone holding your phone can't read your answers."}
        It's a privacy screen, not bank-level encryption.</p>
      <button class="ghost" id="lockBtn">${state.lock ? "Turn off passcode" : "Set a passcode"}</button>
    </div>
    <div class="card"><h2>Your plan</h2>
      ${planSummary()}
      <button class="ghost" id="editPlan">Edit my plan</button>
    </div>
    <div class="card"><h2>Back up your progress</h2>
      <p style="margin-top:0" class="muted">Your progress is saved on this device. Save a backup now and then, especially before getting a new phone.</p>
      <div class="row">
        <button class="ghost" id="exportBtn">Save backup file</button>
        <button class="ghost" id="copyBtn">Copy backup code</button>
      </div>
      <p class="muted">To restore: paste a backup code below, or choose a backup file.</p>
      <textarea id="importText" placeholder="Paste backup code here"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="importBtn">Restore from code</button>
        <label class="ghost" style="display:inline-block;border-radius:12px">Restore from file
          <input type="file" id="importFile" accept=".json,application/json" class="hidden"></label>
      </div>
    </div>
    <div class="card"><h2>About the data</h2>
      <p style="margin-top:0" class="muted">Players, stats, coaches and GMs are real as of ${esc(DATA.day1.snapshotDate)}.
      Games are simulated: a team's strength comes from its players' real 2025-26 Box Plus/Minus, and opponents use their real 2025-26 SRS.
      Seattle doesn't have an NBA team yet; the NBA was only exploring expansion as of October 2026.</p>
      <ul class="muted">${DATA.day1.sources.concat(DATA.teamsSource).map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https:\/\/(www\.)?/, ""))}</a></li>`).join("")}</ul>
    </div>`;
  document.getElementById("editPlan").onclick = () => startWizard(true);
  document.getElementById("lockBtn").onclick = () => state.lock ? removePasscode() : setPasscode();
  const code = () => JSON.stringify(state);
  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([code()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `sonics-backup-${today()}.json`; a.click();
  };
  document.getElementById("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(code()); alert("Backup code copied. Paste it into Notes to keep it safe."); }
    catch (e) { document.getElementById("importText").value = code(); alert("Couldn't copy automatically. The code is in the box below; select it and copy."); }
  };
  const restore = text => {
    try {
      const s = JSON.parse(text);
      if (!s || s.version !== 1 || !Array.isArray(s.log)) throw new Error("bad");
      if (!confirm(`Restore this backup (${s.log.length} days logged)? It replaces what's on this device.`)) return;
      state = s; save(); tab = "today"; render();
    } catch (e) { alert("That doesn't look like a Sonics backup."); }
  };
  document.getElementById("importBtn").onclick = () => restore(document.getElementById("importText").value);
  document.getElementById("importFile").onchange = e => {
    const f = e.target.files[0]; if (f) f.text().then(restore);
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
if (!state) document.getElementById("nav").classList.add("hidden");
render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (state && state.lock) { locked = true; wiz = null; } return; }  // lock as soon as you leave the app
  if (state && !wiz) render();
});

// For testing only.
window.__sonics = { get state() { return state; }, teamRating, playerRating, checkIn, render, newState, daysFree, costPerDay,
  tasksFor, openTaskCount, startWizard, makeQuestion, upgradeStadium, award, playGame, get locked() { return locked; },
  reset() { state = null; try { localStorage.removeItem(KEY); } catch (e) {} } };
</script>
</body>
</html>
